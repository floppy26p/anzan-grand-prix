<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flash Anzan - Army Defense Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            color: white;
            font-family: 'Noto Sans JP', sans-serif;
            touch-action: none;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through where there is no UI */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(5px);
            transition: opacity 0.3s ease;
        }

        .hidden { opacity: 0; pointer-events: none; display: none !important; }

        /* Numpad */
        #numpad-container {
            pointer-events: auto;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-top: 2px solid #3b82f6;
            padding: 1rem;
            padding-bottom: env(safe-area-inset-bottom, 1rem);
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -10px 30px rgba(59, 130, 246, 0.2);
        }

        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            max-width: 400px;
            margin: 0 auto;
        }

        .num-btn {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.5);
            color: #60a5fa;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 1rem 0;
            border-radius: 12px;
            transition: all 0.1s;
        }

        .num-btn:active {
            background: rgba(59, 130, 246, 0.6);
            transform: scale(0.95);
            color: white;
        }

        .action-btn {
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.5);
            color: #34d399;
        }
        .action-btn:active { background: rgba(16, 185, 129, 0.6); }

        .del-btn {
            background: rgba(244, 63, 94, 0.2);
            border-color: rgba(244, 63, 94, 0.5);
            color: #fb7185;
        }
        .del-btn:active { background: rgba(244, 63, 94, 0.6); }

        /* Flashing Number Display */
        #flash-display {
            font-size: 8rem;
            font-weight: 900;
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.8), 0 0 10px white;
            color: white;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            text-align: center;
        }

        #player-input-display {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 0.5rem;
            min-height: 4.5rem;
            color: #60a5fa;
            letter-spacing: 2px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Flash Number Display -->
    <div id="flash-display" class="font-orbitron hidden"></div>

    <!-- UI Layer -->
    <div id="ui-layer">
        
        <!-- Top HUD -->
        <div id="hud" class="w-full flex justify-between p-4 hidden">
            <div class="text-xl font-bold">WAVE: <span id="hud-wave" class="text-blue-400">1</span></div>
            <div class="text-xl font-bold">BASE HP: <span id="hud-hp" class="text-green-400">100</span>%</div>
        </div>

        <!-- Spacer -->
        <div class="flex-grow"></div>

        <!-- Bottom Numpad (Hidden by default) -->
        <div id="numpad-section" class="w-full hidden">
            <div id="numpad-container">
                <div id="player-input-display" class="font-orbitron"></div>
                <div class="numpad-grid font-orbitron">
                    <button class="num-btn" onclick="inputNum(1)">1</button>
                    <button class="num-btn" onclick="inputNum(2)">2</button>
                    <button class="num-btn" onclick="inputNum(3)">3</button>
                    <button class="num-btn" onclick="inputNum(4)">4</button>
                    <button class="num-btn" onclick="inputNum(5)">5</button>
                    <button class="num-btn" onclick="inputNum(6)">6</button>
                    <button class="num-btn" onclick="inputNum(7)">7</button>
                    <button class="num-btn" onclick="inputNum(8)">8</button>
                    <button class="num-btn" onclick="inputNum(9)">9</button>
                    <button class="num-btn del-btn" onclick="deleteNum()">DEL</button>
                    <button class="num-btn" onclick="inputNum(0)">0</button>
                    <button class="num-btn action-btn" onclick="submitAnswer()">ENTER</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Title Screen -->
    <div id="title-screen" class="screen">
        <h1 class="text-4xl md:text-6xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 text-center leading-tight">
            FLASH ANZAN<br><span class="text-2xl text-white">Army Defense</span>
        </h1>
        <p class="mb-8 text-gray-300">iOSデモ版プロトタイプ</p>
        
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 w-11/12 max-w-md">
            <h2 class="text-xl font-bold mb-4 text-center">難易度を選択</h2>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="startGame(1, 3, 1000)" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold text-lg transition-colors">
                    レベル1 (1桁 3口)
                </button>
                <button onclick="startGame(2, 5, 800)" class="w-full py-3 bg-purple-600 hover:bg-purple-500 rounded-xl font-bold text-lg transition-colors">
                    レベル2 (2桁 5口)
                </button>
                <button onclick="startGame(3, 7, 500)" class="w-full py-3 bg-red-600 hover:bg-red-500 rounded-xl font-bold text-lg transition-colors">
                    レベル3 (3桁 7口)
                </button>
            </div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="screen hidden">
        <h2 id="result-title" class="text-5xl font-black mb-4"></h2>
        <p class="text-xl mb-8">到達 WAVE: <span id="result-wave" class="font-bold text-blue-400 text-3xl"></span></p>
        <button onclick="showTitle()" class="px-8 py-4 bg-blue-600 hover:bg-blue-500 rounded-full font-bold text-xl shadow-[0_0_15px_rgba(37,99,235,0.5)] transition-all">
            タイトルへ戻る
        </button>
    </div>

<script>
/**
 * ARMY DEFENSE - Flash Anzan Prototype
 */

// --- Constants & Config ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let cw = canvas.width = window.innerWidth;
let ch = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    cw = canvas.width = window.innerWidth;
    ch = canvas.height = window.innerHeight;
});

// Game State
let state = 'TITLE'; // TITLE, PLAYING_FLASH, PLAYING_INPUT, PLAYING_BATTLE, GAMEOVER
let wave = 1;
let hp = 100;
let config = { digits: 1, count: 3, speed: 1000 };

// Anzan Logic
let currentProblem = [];
let correctAnswer = 0;
let currentInput = "";
let flashIndex = 0;
let lastFlashTime = 0;

// Entities
let enemies = [];
let allies = [];
let particles = [];

// --- Entities Classes ---
class Unit {
    constructor(x, y, color, isEnemy) {
        this.x = x;
        this.y = y;
        this.radius = isEnemy ? 4 : 3.5;
        this.color = color;
        this.isEnemy = isEnemy;
        // Jitter for movement
        this.vx = (Math.random() - 0.5) * 0.5;
        // Base speed
        this.vy = isEnemy ? (0.5 + Math.random() * 0.5) : -(2.5 + Math.random() * 1.5);
        this.dead = false;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        
        // Keep in bounds horizontally
        if (this.x < 0) this.x = 0;
        if (this.x > cw) this.x = cw;
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        // Add glow
        ctx.shadowBlur = 5;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.life = 1.0;
        this.decay = 0.02 + Math.random() * 0.03;
        this.color = color;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, 2, 2);
        ctx.globalAlpha = 1.0;
    }
}

// --- Game Logic ---

function showTitle() {
    state = 'TITLE';
    document.getElementById('title-screen').classList.remove('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('numpad-section').classList.add('hidden');
    enemies = [];
    allies = [];
    particles = [];
}

function startGame(levelStr, numCount, speedMs) {
    let digits = 1;
    if(levelStr === 2) digits = 2;
    if(levelStr === 3) digits = 3;

    config = { digits, count: numCount, speed: speedMs };
    wave = 1;
    hp = 100;
    
    document.getElementById('title-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    
    updateHUD();
    startWave();
}

function generateProblem() {
    currentProblem = [];
    correctAnswer = 0;
    const min = Math.pow(10, config.digits - 1);
    const max = Math.pow(10, config.digits) - 1;
    
    for (let i = 0; i < config.count; i++) {
        // Simple random number generation for prototype
        let num = Math.floor(Math.random() * (max - min + 1)) + min;
        currentProblem.push(num);
        correctAnswer += num;
    }
}

function spawnEnemyWave() {
    // Number of enemies scales with wave and difficulty
    const enemyCount = 20 + (wave * 15 * config.digits);
    for (let i = 0; i < enemyCount; i++) {
        // Spawn slightly above screen
        let x = Math.random() * cw;
        let y = -50 - Math.random() * 200;
        enemies.push(new Unit(x, y, '#ef4444', true));
    }
}

function startWave() {
    generateProblem();
    spawnEnemyWave();
    
    state = 'PLAYING_FLASH';
    flashIndex = 0;
    lastFlashTime = performance.now() + 1000; // 1 sec delay before flashing starts
    
    document.getElementById('flash-display').classList.remove('hidden');
    document.getElementById('flash-display').textContent = 'READY?';
    document.getElementById('numpad-section').classList.add('hidden');
}

function createExplosion(x, y) {
    for(let i=0; i<5; i++) {
        particles.push(new Particle(x, y, '#fbbf24'));
    }
}

// --- Input Handling ---
function inputNum(n) {
    if (state !== 'PLAYING_INPUT') return;
    if (currentInput.length < 6) {
        currentInput += n;
        updateInputDisplay();
    }
}

function deleteNum() {
    if (state !== 'PLAYING_INPUT') return;
    currentInput = currentInput.slice(0, -1);
    updateInputDisplay();
}

function updateInputDisplay() {
    document.getElementById('player-input-display').textContent = currentInput || '_';
}

function submitAnswer() {
    if (state !== 'PLAYING_INPUT') return;
    if (currentInput === "") return;
    
    const answered = parseInt(currentInput);
    
    // Determine how many allies to spawn
    let spawnCount = 0;
    if (answered === correctAnswer) {
        // Correct! Spawn massive army (exact answer, or at least a big minimum)
        spawnCount = Math.max(correctAnswer, 50 + wave * 20); 
        spawnAllies(spawnCount);
        showFeedback("CORRECT!", '#34d399');
    } else {
        // Wrong! Spawn tiny penalty army
        spawnCount = 5; 
        spawnAllies(spawnCount);
        showFeedback("MISS...", '#fb7185');
    }
    
    // Proceed to battle phase
    state = 'PLAYING_BATTLE';
    document.getElementById('numpad-section').classList.add('hidden');
}

function spawnAllies(count) {
    // Spawn allies from bottom center
    for (let i = 0; i < count; i++) {
        let x = cw / 2 + (Math.random() - 0.5) * (cw * 0.8);
        let y = ch + 20 + Math.random() * 100;
        allies.push(new Unit(x, y, '#3b82f6', false));
    }
}

function showFeedback(text, color) {
    const flashEl = document.getElementById('flash-display');
    flashEl.classList.remove('hidden');
    flashEl.style.color = color;
    flashEl.textContent = text;
    
    setTimeout(() => {
        flashEl.classList.add('hidden');
        flashEl.style.color = 'white';
    }, 1500);
}

function updateHUD() {
    document.getElementById('hud-wave').textContent = wave;
    document.getElementById('hud-hp').textContent = hp;
}

function gameOver() {
    state = 'GAMEOVER';
    document.getElementById('result-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('result-wave').textContent = wave;
    document.getElementById('result-title').textContent = hp <= 0 ? "GAME OVER" : "CLEARED!";
    document.getElementById('result-title').style.color = hp <= 0 ? "#ef4444" : "#3b82f6";
}

// --- Main Loop ---
function update(dt, time) {
    // Background Grid scroll effect (subtle)
    
    if (state === 'TITLE' || state === 'GAMEOVER') return;
    
    // Flashing Logic
    if (state === 'PLAYING_FLASH') {
        if (time > lastFlashTime + config.speed) {
            lastFlashTime = time;
            if (flashIndex < currentProblem.length) {
                // Show number
                const el = document.getElementById('flash-display');
                el.textContent = currentProblem[flashIndex];
                // Hide slightly before next to create "flash" effect
                setTimeout(() => {
                    if(state === 'PLAYING_FLASH') el.textContent = '';
                }, config.speed * 0.6);
                
                flashIndex++;
            } else {
                // Flash done, wait for input
                state = 'PLAYING_INPUT';
                currentInput = "";
                updateInputDisplay();
                document.getElementById('flash-display').classList.add('hidden');
                document.getElementById('numpad-section').classList.remove('hidden');
            }
        }
    }
    
    // Entity Updates
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.update();
        
        // Base Damage Check
        if (e.y > ch) {
            enemies.splice(i, 1);
            hp -= 2;
            updateHUD();
            // Screen shake or flash red could go here
            if (hp <= 0) {
                hp = 0;
                gameOver();
            }
        }
    }
    
    for (let i = allies.length - 1; i >= 0; i--) {
        let a = allies[i];
        a.update();
        if (a.y < -50) allies.splice(i, 1); // Clean up allies that flew off top
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.update();
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Collision Detection (O(N*M) is okay for JS up to ~1000 objects total)
    // Only check if we are in battle phase or if allies exist
    if (allies.length > 0 && enemies.length > 0) {
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            if (e.dead) continue;
            
            for (let j = allies.length - 1; j >= 0; j--) {
                let a = allies[j];
                if (a.dead) continue;
                
                // Fast distance check (AABB roughly, then sq dist)
                let dx = e.x - a.x;
                let dy = e.y - a.y;
                if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
                    if (dx*dx + dy*dy < 64) { // radius ~4, combined 8, sq 64
                        e.dead = true;
                        a.dead = true;
                        createExplosion(e.x, (e.y + a.y)/2);
                        break; // This enemy is dead, move to next enemy
                    }
                }
            }
        }
        
        // Cleanup dead
        enemies = enemies.filter(e => !e.dead);
        allies = allies.filter(a => !a.dead);
    }
    
    // Wave Clear Check
    if (state === 'PLAYING_BATTLE') {
        if (enemies.length === 0) {
            // Wave cleared!
            wave++;
            updateHUD();
            startWave();
        } else if (allies.length === 0 && state === 'PLAYING_BATTLE') {
            // Out of ammo! Enemies will just walk into base.
            // (We let the loop continue so player watches them die)
        }
    }
}

function draw(ctx) {
    ctx.clearRect(0, 0, cw, ch);
    
    // Draw Grid (Cyberpunk floor)
    ctx.strokeStyle = 'rgba(59, 130, 246, 0.1)';
    ctx.lineWidth = 1;
    const gridSize = 40;
    const offset = (performance.now() / 20) % gridSize;
    ctx.beginPath();
    // Vertical
    for(let x=0; x<cw; x+=gridSize) {
        ctx.moveTo(x, 0); ctx.lineTo(x, ch);
    }
    // Horizontal moving down
    for(let y=0; y<ch; y+=gridSize) {
        ctx.moveTo(0, y + offset); ctx.lineTo(cw, y + offset);
    }
    ctx.stroke();
    
    // Draw Base Line
    ctx.strokeStyle = hp > 20 ? 'rgba(16, 185, 129, 0.5)' : 'rgba(239, 68, 68, 0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, ch - 5);
    ctx.lineTo(cw, ch - 5);
    ctx.stroke();

    // Draw Entities
    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(p => p.draw(ctx));
    allies.forEach(a => a.draw(ctx));
    enemies.forEach(e => e.draw(ctx));
    ctx.globalCompositeOperation = 'source-over';
}

let lastTime = 0;
function loop(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;
    
    update(dt, timestamp);
    draw(ctx);
    
    requestAnimationFrame(loop);
}

// Start Engine
requestAnimationFrame(loop);

</script>
</body>
</html>
